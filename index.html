<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Design Preview</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Container for the content */
    .container {
      text-align: center;
      width: 100%;
      max-width: 1000px;
      padding: 40px;
      box-sizing: border-box;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

   
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 32px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    h1 span {
      color: #007BFF;
      font-weight: bold;
    }

    .figma-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .figma-container:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    iframe {
      border: none; 
      border-radius: 8px; 
      width: 100%;
      max-width: 800px;
      height: 450px;
      transition: all 0.3s ease;
    }

    iframe:hover {
      transform: scale(1.02); 
    }

   
    @media (max-width: 850px) {
      iframe {
        height: 300px;
      }
    }
    
  
    .figma-container {
      opacity: 0;
      animation: fadeIn 1.5s ease-in-out forwards;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Figma Design Preview <span>Interactive</span></h1>
    <div class="figma-container">
      <iframe 
        src="https://embed.figma.com/design/UmzPLJEo6HWhPFCLLHUd9u/Untitled?node-id=0-1&embed-host=share" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

</body>
</html>
